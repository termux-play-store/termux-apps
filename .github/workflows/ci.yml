name: Check

on:
  push:

jobs:
  actionlint:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Download actionlint
      id: get_actionlint
      run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
    - name: Check GitHub workflows
      run: ${{ steps.get_actionlint.outputs.executable }} -color

  check:
    name: Check gradle build (java ${{ matrix.javaVersion }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        javaVersion: [21, 25]
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
    - uses: gradle/actions/setup-gradle@v6
    - name: Lint, test and build debug APKs
      run: ./gradlew --build-cache lint test assembleDebug
    - uses: actions/upload-artifact@v7
      if: github.ref == 'refs/heads/main' && matrix.javaVersion == 21
      with:
        path: termux-app/build/outputs/apk/debug/termux-app-debug.apk
        archive: false
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      if: github.ref == 'refs/heads/main' && matrix.javaVersion == 21
      with:
        path: termux-style/build/outputs/apk/debug/termux-style-debug.apk
        archive: false
        if-no-files-found: error
